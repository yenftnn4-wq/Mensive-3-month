    <style>
        * {

            font-weight: 700;

            background: linear-gradient(135deg, #FF6FA5, #D14D72);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 24px rgba(209, 77, 114, 0.35);
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(209, 77, 114, 0.45);
        }

        a:active {
            transform: scale(0.97);
        }

        .secondary-link {

            color: #D14D72;
            border: 2px solid #FF6FA5;
            box-shadow: 0 8px 16px rgba(209, 77, 114, 0.2);

        .secondary-link:hover {

            margin-top: 40px;

            color: #6B3A4A;
            font-size: 12px;
